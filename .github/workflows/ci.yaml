name: ci

on:
  push:
    paths:
      - "pom.xml"
      - "**/pom.xml"
      - "**/src/**"
      - ".github/workflows/ci.yaml"
  pull_request:
    paths:
      - "pom.xml"
      - "**/pom.xml"
      - "**/src/**"
      - ".github/workflows/ci.yaml"

jobs:
  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Package
        run: mvn -B -DskipTests package

  integration:
    name: integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Integration tests
        run: mvn -B verify -DskipUnitTests
