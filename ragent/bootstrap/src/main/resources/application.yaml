server:
  port: 9090
  servlet:
    context-path: /api/ragent

spring:
  application:
    name: ragent${unique-name:}-service

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  datasource:
    driver-class-name: org.postgresql.Driver
    type: com.zaxxer.hikari.HikariDataSource
    username: postgres
    password: postgres
    url: jdbc:postgresql://127.0.0.1:5432/ragent?client_encoding=UTF8
    hikari:
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      maximum-pool-size: 10
      minimum-idle: 5
      pool-name: RagentHikariPool

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456

  kafka:
    bootstrap-servers: 127.0.0.1:9092
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual

ragent:
  engine:
    type: agent  # Execution mode: workflow (v1 pipeline) or agent (v2 ReAct, where the RAG pipeline is one tool of the main agent).
  demo-mode: false
  eval:
    enabled: true

# Agent runtime. Used when ragent.engine.type=agent. One model, no fallback. Provider availability is the provider's concern.
agent:
  mcp:
    servers:
      - name: default
        url: http://localhost:9099
  chat:
    provider: deepseek   # Names a provider under ai.providers and uses its url, api-key, and endpoints.chat.
    model: deepseek-flash    # Model name sent as-is to the OpenAI-compatible endpoint.
  max-iters: 10
  max-retries: 1
  sse-timeout-ms: 900000
  max-concurrent-runs-per-user: 5
  memory:
    context-window-chars: 100000
    summary-enabled: true
    long-term-enabled: true
    evictable-tools: [ search_knowledge ]
  trace:
    enabled: false  # Start the Langfuse stack under resources/docker before turning this on.
    capture-content: true  # Records prompts and tool inputs and outputs. Set false to keep only the span skeleton.
    endpoint: http://localhost:3000/api/public/otel/v1/traces
    public-key: pk-lf-ragent-local     # Must match LANGFUSE_INIT_PROJECT_PUBLIC_KEY in the compose file.
    secret-key: sk-lf-ragent-local     # Must match LANGFUSE_INIT_PROJECT_SECRET_KEY in the compose file.
    max-field-chars: 32768
    max-attribute-chars: 131072 # Values over the limit are replaced with valid JSON that keeps a preview.
    service-version:  # Leave empty to use the build-info version. Set this only to override the pom version.
    environment:      # For example local, staging, or prod.

rag:
  storage:
    type: s3  # s3 (rustfs or minio) or oss (Alibaba Cloud).
    kb-bucket: ragent-sources        # Private bucket for knowledge-base documents, isolated by collectionName. OSS bucket names are globally unique, so production must override this.
    asset-bucket: ragent-assets # Public-read bucket for multimodal assets, such as images extracted from PDFs, so a browser can preview them without credentials.
    s3:
      endpoint: http://localhost:9000
      access-key: rustfsadmin
      secret-key: rustfsadmin
      region: us-east-1
      path-style: true
      public-url:  # Set when the public endpoint differs from the internal one. Empty falls back to endpoint.
    oss:
      endpoint: https://oss-cn-hangzhou.aliyuncs.com
      access-key: ${OSS_ACCESS_KEY:}
      secret-key: ${OSS_SECRET_KEY:}
      region: cn-hangzhou
      public-url:  # Virtual-hosted base URL, including the bucket subdomain, such as https://ragent-assets.oss-cn-hangzhou.aliyuncs.com. Empty derives it from endpoint.

  vector:
    type: pg  # milvus or pg.

  keyword:
    type: none  # none or es.
    es:
      uris: http://127.0.0.1:9200
      index: rag_keyword_store  # One shared index. Knowledge bases are separated by the collection_name field.
      analyzer: ik_max_word
      search-analyzer: ik_smart

  graph:
    type: none  # Graph backend: none or lightrag. lightrag connects the backend for admin visualization and read. Search and writes are controlled separately by rag.search.channels.graph.enabled and ingestion.enabled.
    lightrag:
      base-url: http://127.0.0.1:9621
      query-mode: hybrid
    embedding-model: qwen-emb-8b  # Matches the LightRAG SiliconFlow Qwen3-Embedding-8B setup.

  default:
    collection-name: rag_default_store
    dimension: 1536
    metric-type: COSINE
    sse-timeout-ms: 300000  # Global SSE timeout in milliseconds. Default is 5 minutes.

  query-rewrite:
    enabled: true

  rerank:
    enabled: true

  citation:
    enabled: true  # Inline citation markers [N](#cite-N). On adds citation rules and numbers the evidence, which delays the first token. Off still leaves the document-level source panel.

  rate-limit:
    global:
      enabled: true
      max-concurrent: 10
      max-wait-seconds: 15
      lease-seconds: 30
      poll-interval-ms: 200

  memory:
    history-keep-turns: 8
    summary-enabled: true
    summary-start-turns: 9
    summary-max-chars: 400
    title-max-length: 30

  semaphore:
    document-upload:
      name: rag:document:upload
      max-concurrent: 10
      max-wait-seconds: 5
      lease-seconds: 300

  knowledge:
    schedule:
      scan-delay-ms: 10000
      lock-seconds: 900
      batch-size: 20
      min-interval-seconds: 60

  search:
    # Three independent budgets that only narrow. Startup checks that recall-budget and rerank-candidate-limit are both at least default-top-k.
    default-top-k: 10           # 3. How many hits reach the LLM. This is the product topK.
    recall-budget: 20           # 1. Hits recalled per channel. Shared by the vector, keyword, and graph channels. Must be at least default-top-k. 0 falls back to default-top-k.
    # Which knowledge bases this request may search. Independent of the retrieval modality, so all three channels read the same scope.
    # Scope uses the highest knowledge-base intent score, not how many intents matched. Disabling one channel does not change the scope of the others.
    scope:
      min-intent-score: 0.4        # Intent nodes below this score do not affect whether the scope is narrowed.
      confidence-threshold: 0.6    # If the best knowledge-base intent score is below this, search the whole library.
      supplement-ratio: 0.25       # When scoped, each channel reserves this fraction of its quota for libraries that were not selected, in case the intent was wrong. 0 disables the supplement. It is also skipped when the selected libraries already cover everything.
    channels:
      timeout-ms: 15000     # Per-channel query timeout in milliseconds.
      vector:
        enabled: true       # Vector channel switch.
      keyword:
        enabled: false      # Uses the scope resolved by the engine, the same scope as the vector channel.
      graph:
        enabled: false    # Graph search channel. false keeps it out of question answering. The backend and admin view stay available. Set rag.graph.type=lightrag before turning this on.
      web-search:
        enabled: false
        count: 5
        timeout-seconds: 10
        api-key: ${YDC_API_KEY:}
    fusion:
      strategy: rrf
      rrf-k: 20                   # The candidate pool is usually only 20 to 40 items, so k=60 flattens rank. 20 keeps the head more distinct. Calibrate it with the retrieval-attribution logs.
      rerank-candidate-limit: 40  # 2. Cap on the RRF pool sent to rerank. <=0 means no cap. 40 to 100 is the usual range.
      channel-weights:
        vector: 1.0
        keyword: 1.0
        graph: 0.8
        web-search: 0.5
    # Evidence gate. Retrieval always returns the N closest hits, even when the library has no answer. This adds a minimum relevance.
    evidence:
      min-rerank-score: 0.2   # Drop the whole batch when its best rerank score is below this. 0 disables the gate. Recalibrate from the rerank distribution when the model changes.

  trace:
    enabled: true
    max-error-length: 1000

  # Image parsing (image to text).
  # Produces a self-contained passage: what the image is, plus all of its text and hierarchy.
  image-parse:
    description-prompt: |-
      Rewrite this image as a self-contained knowledge passage for retrieval and question answering. Do not describe color, layout, font, or other visual styling.
      1. Open with one or two sentences that say what the image is: its subject, type, and purpose.
      2. Then transcribe all text (OCR), keeping each heading with the items that belong under it. Do not drop any text.
      3. For a chart, architecture diagram, or flowchart, also explain how the parts relate, such as containment, calls, or order.
      4. Keep terminology accurate, and phrase it the way a user might ask about it.
      5. End on a new line that introduces the picture, for example "The original image is shown below:", so the image can follow the text.
    max-output-tokens: 4096

ai:
  providers:
    ollama:
      url: http://localhost:11434
      endpoints:
        chat: /v1/chat/completions
        embedding: /v1/embeddings
    bailian:
      url: https://dashscope.aliyuncs.com
      api-key: ${BAILIAN_API_KEY:}
      endpoints:
        chat: /compatible-mode/v1/chat/completions
        rerank: /api/v1/services/rerank/text-rerank/text-rerank
        embedding: /compatible-mode/v1/embeddings
    aihubmix:
      url: https://aihubmix.com
      api-key: ${AIHUBMIX_API_KEY:}
      endpoints:
        chat: /v1/chat/completions
        embedding: /v1/embeddings
    deepseek:
      url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:}
      endpoints:
        chat: /v1/chat/completions

  selection:
    failure-threshold: 2
    open-duration-ms: 30000

  stream:
    message-chunk-size: 1

  chat:
    candidates:
      - id: qwen-plus
        provider: bailian
        model: qwen-plus-latest
      - id: qwen-flash
        provider: bailian
        model: qwen-flash
      - id: qwen3-local
        provider: ollama
        model: qwen3:8b-fp16
      - id: qwen3.8
        provider: bailian
        model: qwen3.8-27b
      - id: gpt-6.1-sol
        provider: aihubmix
        model: gpt-6.1-sol
      - id: deepseek-flash
        provider: deepseek
        model: deepseek-flash
        supports-thinking: true

    default-tier: standard
    deep-thinking-tier: deep

    tiers:
      fast:
        candidates: [ qwen-flash, qwen-plus, qwen3-local ]
        timeout-ms: 5000
      standard:
        candidates: [ qwen3.8, qwen-plus, deepseek-flash, qwen3-local ]
        timeout-ms: 120000
      deep:
        candidates: [ deepseek-flash ]
        timeout-ms: 180000

  embedding:
    default-model: qwen-emb-8b
    candidates:
      - id: qwen-emb-8b
        provider: bailian
        model: text-embedding-v4
        dimension: ${rag.default.dimension}
        priority: 1
      - id: qwen-emb-local
        provider: ollama
        model: qwen3-embedding:8b-fp16
        dimension: ${rag.default.dimension}
        priority: 2
      - id: text-embedding-3-large
        provider: aihubmix
        model: text-embedding-3-large
        dimension: ${rag.default.dimension}
        priority: 3

  rerank:
    default-model: qwen3-rerank
    candidates:
      - id: qwen3-rerank
        provider: bailian
        model: qwen3-rerank
        priority: 1
      - id: rerank-noop
        provider: noop
        model: noop
        priority: 100

  vlm:
    default-model: qwen-vl-max
    candidates:
      - id: qwen-vl-max
        provider: bailian
        model: qwen-vl-max

# MinerU SaaS API. PDF, Word, and PowerPoint are parsed through MinerU.
mineru:
  api-url: https://mineru.net/api/v4
  api-key: ${MINERU_API_KEY:}
  poll-interval-seconds: 5
  timeout-seconds: 300
  enable-table: true
  enable-formula: true
  ocr: false
  language: en
  concurrency-limit: 5
  semaphore-name: rag:mineru:parse
  max-wait-seconds: 30
  lease-seconds: 900

sa-token:
  token-name: Authorization
  timeout: 2592000
  is-concurrent: true
  is-share: false
  token-style: simple-uuid
  is-log: false
  is-print: false

milvus:
  uri: http://localhost:19530
